name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # Indicates the CMake build directory where project files and binaries are being produced.
  CMAKE_BUILD_DIR: ${{ github.workspace }}/build/

jobs:
  minimum-cmake-version:
    name: Check compatibility with minimum cmake version
    runs-on: ubuntu-latest
    env:
      CMAKE_VERSION: 3.21.0
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt install -y libgl1-mesa-dev libwayland-dev libwayland-egl-backend-dev
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - name: Check cmake version
        run: |
          cmake --version | grep ${{ env.CMAKE_VERSION }}
      - name: Test config
        # old way of configuring a build directory
        run: |
          mkdir -p "${{ env.CMAKE_BUILD_DIR }}"
          cd "${{ env.CMAKE_BUILD_DIR }}"
          cmake ${{ github.workspace }} -GNinja -DCMAKE_BUILD_TYPE=Release

  native:
    name: ${{ matrix.os }} ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    needs: minimum-cmake-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-latest
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt install -y libgl1-mesa-dev libwayland-dev libwayland-egl-backend-dev
        if: matrix.os == 'ubuntu-latest'

      # Setup the build machine with the most recent versions of CMake and Ninja. Both are cached if not already: on subsequent runs both will be quickly restored from GitHub cache service.
      - uses: lukka/get-cmake@latest

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%p in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_DIR=%%p
          call "%VS_DIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set >> "%GITHUB_ENV%"

      # Run CMake to generate Ninja project files
      - name: Generate project files
        run: |
          cmake -B "${{ env.CMAKE_BUILD_DIR }}" -GNinja -DCMAKE_BUILD_TYPE=Release -DBGFX_BUILD_TESTS=ON

      # Build the whole project with Ninja (which is spawn by CMake).
      - name: Build
        run: |
          cmake --build "${{ env.CMAKE_BUILD_DIR }}"

      # Build the examples which are excluded from all
      - name: Build examples
        run: |
          cmake --build "${{ env.CMAKE_BUILD_DIR }}" --target bgfx-examples

      - name: Run bx tests
        run: |
          ctest --test-dir "${{ env.CMAKE_BUILD_DIR }}" -R bx.test --output-on-failure

  cross-android:
    name: cross-android
    runs-on: ubuntu-latest
    needs: minimum-cmake-version
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt install -y libgl1-mesa-dev libwayland-dev libwayland-egl-backend-dev
        if: matrix.os == 'ubuntu-latest'

      # Setup the build machine with the most recent versions of CMake and Ninja. Both are cached if not already: on subsequent runs both will be quickly restored from GitHub cache service.
      - uses: lukka/get-cmake@latest

      # Run CMake to generate Ninja project files
      - name: Generate project files
        run: |
          cmake -B "${{ env.CMAKE_BUILD_DIR }}" -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake -DANDROID_PLATFORM=34

      # Build the whole project with Ninja (which is spawn by CMake).
      - name: Build
        run: |
          cmake --build "${{ env.CMAKE_BUILD_DIR }}"

      # Build the examples which are excluded from all
      - name: Build examples
        run: |
          cmake --build "${{ env.CMAKE_BUILD_DIR }}" --target bgfx-examples
