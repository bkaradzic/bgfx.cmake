name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # Indicates the CMake build directory where project files and binaries are being produced.
  CMAKE_BUILD_DIR: ${{ github.workspace }}/build/

jobs:
  minimum-cmake-version:
    name: Check compatibility with minimum cmake version
    runs-on: ubuntu-latest
    env:
      CMAKE_VERSION: 3.21.0
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt install -y libgl1-mesa-dev libwayland-dev libwayland-egl-backend-dev
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}
      - name: Check cmake version
        run: |
          cmake --version | grep ${{ env.CMAKE_VERSION }}
      - name: Test config
        run: |
          mkdir -p "${{ env.CMAKE_BUILD_DIR }}"
          cd "${{ env.CMAKE_BUILD_DIR }}"
          cmake ${{ github.workspace }} -GNinja -DCMAKE_BUILD_TYPE=Release
          cmake -DINPUT_FILE="${{ github.workspace }}/cmake/dependencies.cmake" -DOUTPUT_FILE="${{ env.CMAKE_BUILD_DIR }}/pins.txt" -P "${{ github.workspace }}/cmake/dependency-pins.cmake"
          while read -r dep pin; do
            test "$(git -C "_deps/${dep}_source-src" rev-parse HEAD)" = "$pin"
            test "$(git -C "_deps/${dep}_source-src" rev-parse --is-shallow-repository)" = false
          done < pins.txt
          cmake ${{ github.workspace }} -GNinja -DCMAKE_BUILD_TYPE=Release
      - name: Test parent FetchContent and partial source overrides
        run: |
          cmake -S "${{ github.workspace }}/cmake/tests/parent-fetchcontent" -B "${{ github.workspace }}/build/parent-fetchcontent" -GNinja \
            -DBGFX_WRAPPER_SOURCE_DIR="${{ github.workspace }}" -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/build/_deps"
          cmake -S "${{ github.workspace }}/cmake/tests/parent-fetchcontent" -B "${{ github.workspace }}/build/parent-overrides" -GNinja \
            -DBGFX_WRAPPER_SOURCE_DIR="${{ github.workspace }}" -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/build/_deps" \
            -DBGFX_PARENT_USE_ADD_SUBDIRECTORY=ON \
            -DBX_DIR="${{ github.workspace }}/build/_deps/bx_source-src" \
            -DBGFX_DIR="${{ github.workspace }}/build/_deps/bgfx_source-src"

  native:
    name: ${{ matrix.os }} ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    needs: minimum-cmake-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: macos-latest
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt install -y libgl1-mesa-dev libwayland-dev libwayland-egl-backend-dev
        if: matrix.os == 'ubuntu-latest'

      # Setup the build machine with the most recent versions of CMake and Ninja. Both are cached if not already: on subsequent runs both will be quickly restored from GitHub cache service.
      - uses: lukka/get-cmake@latest

      # On Windows runners, let's ensure to have the Developer Command Prompt environment setup correctly. As used here the Developer Command Prompt created is targeting x64 and using the default the Windows SDK.
      - uses: ilammy/msvc-dev-cmd@v1

      # Run CMake to generate Ninja project files
      - name: Generate project files
        run: |
          cmake -B "${{ env.CMAKE_BUILD_DIR }}" -GNinja -DCMAKE_BUILD_TYPE=Release -DBGFX_BUILD_TESTS=ON

      # Build the whole project with Ninja (which is spawn by CMake).
      - name: Build
        run: |
          cmake --build "${{ env.CMAKE_BUILD_DIR }}"

      # Build the examples which are excluded from all
      - name: Build examples
        run: |
          cmake --build "${{ env.CMAKE_BUILD_DIR }}" --target bgfx-examples

      - name: Run bx tests
        run: |
          ctest --test-dir "${{ env.CMAKE_BUILD_DIR }}" -R bx.test --output-on-failure

  cross-android:
    name: cross-android
    runs-on: ubuntu-latest
    needs: minimum-cmake-version
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt install -y libgl1-mesa-dev libwayland-dev libwayland-egl-backend-dev
        if: matrix.os == 'ubuntu-latest'

      # Setup the build machine with the most recent versions of CMake and Ninja. Both are cached if not already: on subsequent runs both will be quickly restored from GitHub cache service.
      - uses: lukka/get-cmake@latest

      # On Windows runners, let's ensure to have the Developer Command Prompt environment setup correctly. As used here the Developer Command Prompt created is targeting x64 and using the default the Windows SDK.
      - uses: ilammy/msvc-dev-cmd@v1

      # Run CMake to generate Ninja project files
      - name: Generate project files
        run: |
          cmake -B "${{ env.CMAKE_BUILD_DIR }}" -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake -DANDROID_PLATFORM=24

      # Build the whole project with Ninja (which is spawn by CMake).
      - name: Build
        run: |
          cmake --build "${{ env.CMAKE_BUILD_DIR }}"

      # Build the examples which are excluded from all
      - name: Build examples
        run: |
          cmake --build "${{ env.CMAKE_BUILD_DIR }}" --target bgfx-examples
